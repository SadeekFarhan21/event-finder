# Every push and PR: typecheck the app and the edge function, run expo-doctor, run unit tests.
# Integration tests hit a real Supabase project, so they run on demand (Actions tab -> Run
# workflow) and only when the repo has the SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY secrets.
name: CI

on:
  push:
    branches: [main, refactor]
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: "Also run integration tests against Supabase"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck, expo-doctor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx expo-doctor

  functions:
    name: Functions + unit tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck the scout function
        run: deno check --config supabase/functions/scout/deno.json supabase/functions/scout/index.ts
      - name: Agent unit tests
        run: deno test --config supabase/functions/scout/deno.json supabase/functions/tests/
      - name: App logic unit tests
        run: deno test --unstable-sloppy-imports --no-check tests/app_lib_test.ts

  integration:
    name: Integration (live Supabase)
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    needs: [functions]
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      REVIEW_KEY: ${{ secrets.REVIEW_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-net --allow-env tests/integration_test.ts
