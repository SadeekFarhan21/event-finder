<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Scout Listing Review</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #FBFAF6; --surface: #FFFFFF; --fill: #F4F2EA; --line: #E8E5D9;
    --ink: #1A1814; --ink-2: #4F4B42; --ink-3: #6B665A; --yellow: #FFE600; --blue: #1F4FFF; --red: #B42318;
    --display: "Instrument Serif", Georgia, serif; --body: "Inter", system-ui, sans-serif;
  }
  /* Type: 13 / 15 body sizes, 22 / 28 / 40 display. Spacing: 4/8/12/16/24/32/48. Hairline borders, no shadows. */
  *,*::before,*::after { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--body); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 8px; }
  h1 { font: 400 40px/1.05 var(--display); margin: 0; }
  .note { color: var(--ink-3); font-size: 16px; margin: 8px 0 0; max-width: 65ch; }
  .keyrow { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; align-items: end; }
  .keyrow label { flex-basis: 100%; font-size: 14px; font-weight: 500; color: var(--ink-2); }
  input, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px; min-width: 0; }
  .keyrow input { flex: 0 1 360px; }
  button { font: 600 16px var(--body); min-height: 48px; border: 1px solid var(--ink); border-radius: 999px; padding: 0 16px; cursor: pointer; background: var(--surface); color: var(--ink); }
  button:hover { background: var(--fill); }
  /* Yellow only for the decision itself; "Open queue" stays outlined. */
  button.approve { background: var(--yellow); border-color: var(--yellow); color: var(--on-yellow); }
  button.approve:hover { background: var(--yellow-hover); }
  button.reject { border-color: var(--line); color: var(--ink-2); }
  button:disabled { opacity: .5; cursor: default; }
  h2 { font: 400 28px/1.1 var(--display); margin: 32px 0 12px; }
  .item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 8px; }
  .meta { font-size: 14px; color: var(--ink-3); margin: 0; }
  .venue { font: 400 28px/1.2 var(--display); margin: 4px 0 0; }
  .title { font-weight: 600; margin: 4px 0 0; }
  dl { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 4px 12px; margin: 12px 0 0; }
  dt { color: var(--ink-3); font-size: 14px; padding-top: 2px; } dd { margin: 0; overflow-wrap: anywhere; }
  dd a { color: var(--blue); }
  .actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
  .actions input { flex: 1 1 200px; }
  .empty { color: var(--ink-3); margin: 0; }
  .err { color: var(--red); margin: 12px 0 0; }
  .err:empty { margin: 0; }

  /* Night palette, same as the app: warm near-blacks, one accent (Yelo yellow), red for errors.
     Links and focus rings use ink instead of a second color. */
  :root, :root:not([data-theme="light"]), :root[data-theme] {
    --bg: #0C0C0A; --surface: #151513; --fill: #1D1C19; --line: #282723;
    --ink: #F2F0E9; --ink-2: #C2BEB2; --ink-3: #8E8A7F; --placeholder: #8E8A7F;
    --yellow: #FFE14A; --on-yellow: #14130F; --yellow-hover: #F5D63E; --blue: #F2F0E9; --red: #FF7A6B;
    color-scheme: dark;
  }
  .top { margin-bottom: 32px; }
  .mark { display: inline-flex; align-items: baseline; min-height: 44px; padding: 8px 0; font: 400 28px/1 var(--display); color: var(--ink); text-decoration: none; }
  .mark i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); margin-left: 3px; }
  .mark-sub { font: 500 14px var(--body); color: var(--ink-3); margin-left: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="mark" href="./">Scout<i aria-hidden="true"></i><span class="mark-sub">Review</span></a></header>
  <h1>Listing review</h1>
  <p class="note">Venue submissions waiting for a yes or no. Approved listings go on Scout's map right away.</p>
  <form class="keyrow" id="keyform">
    <label for="key">Review key</label>
    <input id="key" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Open queue</button>
  </form>
  <p class="err" id="err" role="alert"></p>
  <div id="queue"></div>
</div>
<script>
  const FN = "https://ihxsdwpersowxxtgqcws.supabase.co/functions/v1/scout";
  const $ = (id) => document.getElementById(id);
  // Only http(s) links become clickable; anything else (javascript:, data:) is shown as text.
  const safeHref = (u) => { try { const p = new URL(u); return p.protocol === "http:" || p.protocol === "https:" ? p.href : null; } catch { return null; } };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  // The key stays in this browser only (it's the reviewer's own browser), so the queue reopens on reload.
  const store = { get: () => { try { return localStorage.getItem("scout.reviewKey"); } catch { return null; } },
                  set: (k) => { try { localStorage.setItem("scout.reviewKey", k); } catch {} } };

  async function call(body) {
    const res = await fetch(FN, { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${$("key").value}` },
      body: JSON.stringify({ task: "review", ...body }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  function item(s) {
    const when = s.start ? new Date(s.start).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "Standing deal";
    return `<article class="item" data-id="${s.id}">
      <p class="meta">${esc(s.city)} · ${esc(s.category)} · sent ${new Date(s.updated_at).toLocaleString()}</p>
      <p class="venue">${esc(s.venue)}</p><p class="title">${esc(s.title)}</p>
      <dl><dt>When</dt><dd>${esc(when)}</dd><dt>Address</dt><dd>${esc(s.address)}</dd>
        ${s.deal ? `<dt>Deal</dt><dd>${esc(s.deal)}</dd>` : ""}${s.description ? `<dt>About</dt><dd>${esc(s.description)}</dd>` : ""}
        ${s.url ? `<dt>Link</dt><dd>${safeHref(s.url) ? `<a href="${esc(safeHref(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a>` : esc(s.url)}</dd>` : ""}
        <dt>Contact</dt><dd>${esc(s.contact_email)}</dd></dl>
      ${s.status === "pending" ? `<div class="actions"><button class="approve" data-act="approve">Approve</button>
        <input placeholder="Note to the venue if rejecting (optional)" maxlength="300" aria-label="Rejection note">
        <button class="reject" data-act="reject">Reject</button></div>` : ""}
    </article>`;
  }

  async function load() {
    $("err").textContent = "";
    try {
      const { submissions } = await call({ action: "list" });
      store.set($("key").value);
      const group = (st) => submissions.filter((s) => s.status === st);
      const pending = group("pending");
      $("queue").innerHTML = `<h2>Waiting (${pending.length})</h2>${pending.map(item).join("") || `<p class="empty">Nothing to review.</p>`}
        <h2>Approved</h2>${group("approved").map(item).join("") || `<p class="empty">None yet.</p>`}
        ${group("rejected").length ? `<h2>Rejected</h2>${group("rejected").map(item).join("")}` : ""}`;
    } catch (e) { $("err").textContent = e.message; }
  }

  $("keyform").addEventListener("submit", (ev) => { ev.preventDefault(); load(); });
  $("queue").addEventListener("click", async (ev) => {
    const b = ev.target.closest("button[data-act]"); if (!b) return;
    const card = b.closest(".item"); card.querySelectorAll("button").forEach((x) => (x.disabled = true));
    try {
      const r = await call({ action: b.dataset.act, id: Number(card.dataset.id), note: card.querySelector("input")?.value });
      if (r.failed?.length) $("err").textContent = `Couldn't place it on the map: ${r.failed[0].why}. It's back in the queue.`;
      load();
    } catch (e) { $("err").textContent = e.message; card.querySelectorAll("button").forEach((x) => (x.disabled = false)); }
  });
  const saved = store.get(); if (saved) { $("key").value = saved; load(); }
</script>
</body>
</html>
