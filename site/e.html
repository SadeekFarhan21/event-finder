<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scout · A night out</title>
<meta name="description" content="Where it is, when it starts, who's going, and the ride there. Open it to join them.">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0C0C0A">
<meta property="og:title" content="A friend sent you a night out · Scout">
<meta property="og:description" content="Where it is, when it starts, who's going, and the ride there. Open it to join them.">
<meta property="og:image" content="https://scout-download.vercel.app/og-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #FBFAF6; --surface: #FFFFFF; --fill: #F4F2EA; --line: #E8E5D9;
    --ink: #1A1814; --ink-2: #4F4B42; --ink-3: #6B665A;
    --yellow: #FFE600; --blue: #1F4FFF; --red: #B42318;
    --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* Type: 13 / 15 / 16 body sizes, 26 + 40 display. Spacing: 4/8/12/16/24/32/48. Hairline borders, no shadows. */
  *,*::before,*::after { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--body); }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 8px; }
  .mark { display: inline-flex; align-items: baseline; min-height: 44px; padding: 8px 0; gap: 0; font: 400 28px/1 var(--display); color: var(--ink); text-decoration: none; }
  .mark i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); margin-left: 3px; }
  .mark-sub { font: 500 14px var(--body); color: var(--ink-3); margin-left: 10px; }
  .card { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .hero { display: block; width: 100%; height: 200px; object-fit: cover; background: var(--fill); border-bottom: 1px solid var(--line); }
  .body { padding: 24px 16px; }
  .eyebrow { font-size: 14px; font-weight: 500; color: var(--ink-3); margin: 0; }
  h1 { font: 400 40px/1.05 var(--display); margin: 4px 0 0; text-wrap: balance; overflow-wrap: anywhere; }
  .title { font-weight: 600; margin: 8px 0 0; }
  .desc { color: var(--ink-2); margin: 4px 0 0; max-width: 65ch; }
  dl { margin: 16px 0 0; border-top: 1px solid var(--line); }
  dl div { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  dt { width: 56px; flex: none; font-size: 14px; color: var(--ink-3); padding-top: 2px; }
  dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .going { margin: 16px 0 0; font-size: 16px; color: var(--ink-2); }
  .going b { color: var(--ink); }
  .actions { display: grid; gap: 8px; margin-top: 24px; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 16px; border-radius: 999px; font: 600 16px var(--body); color: var(--ink); text-decoration: none; }
  .btn.primary { background: var(--yellow); color: var(--on-yellow); }
  .btn.primary:hover { background: var(--yellow-hover); }
  .btn.quiet { background: var(--surface); border: 1px solid var(--line); }
  .btn.quiet:hover { border-color: var(--ink-3); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .band { display: flex; align-items: baseline; gap: 12px; padding: 24px 24px 20px; background: var(--fill); border-bottom: 1px solid var(--line); }
  .band b { font: 400 48px/1 var(--display); color: var(--ink); }
  .band span { font-size: 14px; color: var(--ink-3); }
  .note { font-size: 14px; color: var(--ink-3); margin: 16px 0 0; }
  .empty { margin-top: 48px; }
  .empty .desc { margin-top: 12px; }
  .empty .note { margin-top: 32px; }
  .invite { font: 400 28px/1.2 var(--display); margin: 32px 0 0; text-wrap: balance; }
  .crew { margin-top: 16px; padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--fill); }
  .crewhead { margin: 0; font-size: 16px; color: var(--ink-2); }
  .crewhead b { color: var(--ink); }
  .members { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .member { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 500; }
  .member small { color: var(--ink-3); font-size: 14px; font-weight: 400; }
  .member.out { opacity: .5; }
  .member i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
  .member i.on_way { background: var(--yellow); box-shadow: 0 0 0 1px var(--ink); }
  .member i.out { background: var(--line); }
  .join { margin-top: 16px; }
  .join label { display: block; font-size: 14px; font-weight: 500; color: var(--ink-2); margin-bottom: 4px; }
  .joinrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .joinrow input { flex: 1 1 160px; min-width: 0; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; height: 48px; }
  .joinrow .btn, .statusrow .btn { flex: 1 1 140px; border: 0; cursor: pointer; }
  .statusrow { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .crew .btn.quiet { border: 1px solid var(--line); }
  .msg { font-size: 14px; color: var(--red); margin: 8px 0 0; min-height: 1em; }

  /* Night palette, same as the app: warm near-blacks, one accent (Yelo yellow), red for errors.
     Links and focus rings use ink instead of a second color. */
  :root, :root:not([data-theme="light"]), :root[data-theme] {
    --bg: #0C0C0A; --surface: #151513; --fill: #1D1C19; --line: #282723;
    --ink: #F2F0E9; --ink-2: #C2BEB2; --ink-3: #8E8A7F; --placeholder: #8E8A7F;
    --yellow: #FFE14A; --on-yellow: #14130F; --yellow-hover: #F5D63E; --blue: #F2F0E9; --red: #FF7A6B;
    color-scheme: dark;
  }
  .actions .link { align-self: flex-start; padding: 12px 0; color: var(--ink-2); font-size: 16px; text-decoration: underline; text-underline-offset: 3px; }
  .actions .link:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <a class="mark" href="./">Scout<i aria-hidden="true"></i></a>
  <p id="live" class="sr" aria-live="polite"></p>
  <main id="app"><p class="note" style="margin-top:32px">Loading the night…</p></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script>
  // Publishable key: read-only access to public listings and aggregate counts.
  const db = supabase.createClient("https://ihxsdwpersowxxtgqcws.supabase.co", "sb_publishable_WGHco-ibd0wX9Jhe3x5vJQ_Rb5ys6UZ", { auth: { persistSession: false } });
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const LABEL = { nightlife: "Nightlife", music: "Live music", food_drink: "Food & drink", arts: "Arts", sports: "Sports", community: "Community", deal: "Deal" };
  const app = document.getElementById("app");
  const isAndroid = /android/i.test(navigator.userAgent);
  const SERVED = ["new york, ny", "los angeles, ca"];

  // Times read in the spot's city, not the visitor's: an LA show is "7 PM" even opened in New York.
  let ZONE;
  const zoneFor = (city) => /los angeles/i.test(city || "") ? "America/Los_Angeles" : /new york/i.test(city || "") ? "America/New_York" : undefined;
  const fmtT = (d, o) => d.toLocaleTimeString(undefined, { ...o, timeZone: ZONE });
  const fmtD = (d, o) => d.toLocaleDateString(undefined, { ...o, timeZone: ZONE });
  const ymd = (t) => new Date(t).toLocaleDateString("en-CA", { timeZone: ZONE }); // YYYY-MM-DD in the city
  const nightKey = (t) => Date.parse(ymd(t - 6 * 3600e3)) / 864e5; // a night runs until 6am

  // Same rule as the app: a night runs until 6am, so a 1am set still reads "Tonight".
  function when(e) {
    const text = `${e.title} ${e.deal ?? ""} ${e.description ?? ""}`;
    if (e.category === "deal" || /happy hour|every (mon|tue|wed|thu|fri|sat|sun)|daily|weekly|nightly/i.test(text)) {
      // Keep the hours the listing states ("4-7pm", "5 to 8 PM"); never invent them.
      const hours = text.match(/\b\d{1,2}(:\d\d)?\s*(am|pm)?\s*(-|–|to)\s*\d{1,2}(:\d\d)?\s*(am|pm)\b/i)?.[0];
      const label = /happy hour/i.test(text) ? "Happy hour" : "Every night this week";
      return hours ? `${label} · ${hours.replace(/\s*(-|–|to)\s*/i, "–")}` : label;
    }
    if (!e.start) return "Ongoing";
    const d = new Date(e.start);
    const days = Math.round(nightKey(d.getTime()) - nightKey(Date.now()));
    const day = days === 0 ? "Tonight" : days === 1 ? "Tomorrow" : fmtD(d, { weekday: "long", month: "short", day: "numeric" });
    return `${day} · ${fmtT(d, { hour: "numeric", minute: "2-digit" })}`;
  }

  // Three different situations, three different messages: an expired night, a link that
  // doesn't match anything, and a connection problem (which is worth retrying).
  function gone(kind = "expired") {
    const copy = {
      expired: ["This night has passed.", "Spots on Scout last about a week. See what's on now in the app."],
      missing: ["We couldn't find that link.", "It may have been copied incompletely. Ask your friend to send it again."],
      offline: ["Couldn't load this right now.", "Check your connection and try again."],
    }[kind];
    app.innerHTML = `<section class="empty"><h1>${copy[0]}</h1><p class="desc">${copy[1]}</p>
      <div class="actions">${kind === "offline"
        ? `<button class="btn primary" type="button" onclick="location.reload()">Try again</button>`
        : isAndroid ? `<a class="btn primary" href="./">Get Scout for Android</a>` : `<a class="btn quiet" href="./">See what Scout is</a>`}</div>
      <p class="note">Scout finds what's on tonight in New York and Los Angeles and shows the ride there. An independent prototype, not an official Yelo app.</p></section>`;
  }

  // A browser joining a crew gets its own random id (kept in this browser), like a phone does.
  function deviceId() {
    try {
      let d = localStorage.getItem("scout.deviceId");
      if (!d) { d = crypto.randomUUID(); localStorage.setItem("scout.deviceId", d); }
      return d;
    } catch { return crypto.randomUUID(); }
  }
  // Android: open the crew in Scout if it's installed, otherwise land on the download page.
  const appLink = (code) => /android/i.test(navigator.userAgent)
    ? `intent://crew/${code}#Intent;scheme=scout;package=com.farhan.scout;S.browser_fallback_url=${encodeURIComponent(location.origin + "/")};end`
    : "./";
  const STATUS = { in: "Coming", on_way: "On the way", out: "Can't make it" };
  function leaveLabel(iso) {
    const d = new Date(iso), mins = Math.round((d - Date.now()) / 60000);
    if (mins <= 0 && mins > -90) return "now";
    if (mins > 0 && mins < 60) return `in ${mins} min`;
    const t = fmtT(d, { hour: "numeric", minute: "2-digit" });
    return ymd(Date.now()) === ymd(d.getTime()) ? `at ${t}` : `${fmtD(d, { weekday: "long" })} at ${t}`;
  }

  function crewHtml(c) {
    const me = c.members.find((m) => m.me);
    const coming = c.members.filter((m) => m.status !== "out").length;
    const chips = c.members.map((m) => `<span class="member${m.status === "out" ? " out" : ""}"><i class="${m.status}"></i>${esc(m.me ? "You" : m.name)}<small>${STATUS[m.status]}</small></span>`).join("");
    const action = !me
      ? `<form class="join" id="join"><label for="nm">Your first name</label><div class="joinrow">
           <input id="nm" required maxlength="30" autocomplete="given-name" placeholder="First name">
           <button class="btn primary" type="submit">Join the crew</button></div><p class="msg" id="msg" role="status"></p></form>`
      : `<div class="statusrow">
           <button class="btn ${me.status === "on_way" ? "quiet" : "primary"}" data-status="on_way">${me.status === "on_way" ? "You're on the way" : "I'm on my way"}</button>
           <button class="btn quiet" data-status="${me.status === "out" ? "in" : "out"}">${me.status === "out" ? "I'm back in" : "Can't make it"}</button></div>`;
    return `<section class="crew" aria-label="Crew"><p class="crewhead"><b>Leaving ${esc(leaveLabel(c.leave_at))}</b> · ${coming} coming</p>
      <div class="members">${chips}</div>${action}</section>`;
  }

  // No photo (most scraped listings): the start time set large on a tonal band, as in the app.
  function band(e) {
    if (!e.start) return "";
    const d = new Date(e.start);
    const time = fmtT(d, { hour: "numeric", minute: "2-digit" }).replace(":00", "");
    const day = nightKey(d.getTime()) === nightKey(Date.now()) ? "Tonight" : fmtD(d, { weekday: "long", month: "short", day: "numeric" });
    return `<div class="band" aria-hidden="true"><b>${esc(time)}</b><span>${esc(day)}</span></div>`;
  }

  // The page refreshes every 20 s; only a change in who's coming is announced, not the whole page.
  let lastComing = null;
  function announce(crew) {
    const n = crew.members.filter((m) => m.status !== "out").length;
    if (lastComing !== null && n !== lastComing) document.getElementById("live").textContent = `${n} coming now`;
    lastComing = n;
  }

  async function render() {
    const q = new URLSearchParams(location.search);
    const code = (q.get("crew") || "").toLowerCase();
    let crew = null, id = q.get("id");
    // Short share links (?s=3f9a1c2e) name a spot by its code; look up the full id.
    const short = (q.get("s") || "").toLowerCase();
    if (short && !id && !code) {
      if (!/^[a-f0-9]{8}$/.test(short)) return gone("missing");
      const { data: hit, error: e1 } = await db.from("upcoming_events").select("id").eq("short", short).limit(1).maybeSingle();
      if (e1) return gone("offline");
      if (!hit) return gone("expired");
      id = hit.id;
    }
    if (code) {
      if (!/^[a-f0-9]{8,16}$/.test(code)) return gone("missing");
      const { data, error } = await db.rpc("get_crews", { p_codes: [code], p_device_id: deviceId() });
      if (error) return gone("offline");
      crew = data?.[0] ?? null;
      if (!crew) return gone("missing");
      if (Date.parse(crew.leave_at) < Date.now() - 12 * 3600e3) return gone("expired");
      id = crew.spot_id;
    }
    if (!id) return gone("missing");
    const [{ data: live, error: loadErr }, { data: g }] = await Promise.all([
      db.from("upcoming_events").select("*").eq("id", id).maybeSingle(),
      db.rpc("going_counts", { p_spot_ids: [id] }),
    ]);
    // The scout may have merged or refreshed the listing since the crew started; the crew keeps
    // its own copy of the spot, so fall back to that.
    const e = live ?? (crew && { venue: crew.venue, title: crew.title, address: crew.address, start: crew.start, category: "" });
    if (loadErr && !crew) return gone("offline");
    if (!e) return gone("expired");
    if (live && !SERVED.includes(live.city)) return gone("expired"); // Scout covers NYC and LA
    ZONE = zoneFor(live?.city); // before any time is formatted
    const going = Number(g?.[0]?.going ?? 0);
    const dest = encodeURIComponent(`${e.venue}, ${e.address}`);
    document.title = crew ? `Crew to ${e.venue} · Scout` : `${e.venue} · ${when(e)} · Scout`;
    app.innerHTML = `
      ${crew ? `<p class="invite">${esc(crew.members[0]?.name ?? "A friend")} is heading out. Come with.</p>` : ""}
      <article class="card">
        ${e.image ? `<img class="hero" src="${esc(e.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : band(e)}
        <div class="body">
          <p class="eyebrow">${e.partner ? "Yelo partner · " : ""}${esc(LABEL[e.category] ?? "")}</p>
          <h1>${esc(e.venue)}</h1>
          <p class="title">${esc(e.title)}</p>
          ${e.description ? `<p class="desc">${esc(e.description)}</p>` : ""}
          ${crew ? crewHtml(crew) : ""}
          <dl>
            <div><dt>When</dt><dd>${esc(when(e))}</dd></div>
            <div><dt>Where</dt><dd>${esc(e.address)}</dd></div>
            ${e.price ? `<div><dt>Price</dt><dd>${esc(e.price)}</dd></div>` : ""}
            ${e.deal ? `<div><dt>Deal</dt><dd>${esc(e.deal)}</dd></div>` : ""}
          </dl>
          ${crew || !going ? "" : `<p class="going"><b>${going} ${going === 1 ? "person" : "people"}</b> on Scout ${going === 1 ? "is" : "are"} going.</p>`}
          <div class="actions">
            ${isAndroid && !crew ? `<a class="btn primary" href="./">Get Scout to say you're going</a>` : ""}
            <a class="btn ${crew || isAndroid ? "quiet" : "primary"}" href="https://www.google.com/maps/dir/?api=1&destination=${dest}" target="_blank" rel="noopener">Directions</a>
            ${e.url && /^https?:\/\//.test(e.url) ? `<a class="link" href="${esc(e.url)}" target="_blank" rel="noopener">Event page</a>` : ""}
            ${crew && isAndroid ? `<a class="link" href="${appLink(code)}">Open in the Scout app</a>` : ""}
          </div>
        </div>
      </article>
      <p class="note">Scout finds what's on tonight in New York and Los Angeles and shows the ride there. An independent prototype, not an official Yelo app.</p>`;

    if (!crew) return;
    announce(crew);
    document.getElementById("join")?.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const name = document.getElementById("nm").value.trim(), btn = ev.target.querySelector("button");
      btn.disabled = true;
      const { error } = await db.rpc("join_crew", { p_code: code, p_device_id: deviceId(), p_name: name });
      if (error) { btn.disabled = false; document.getElementById("msg").textContent = error.message; return; }
      render();
    });
    document.querySelectorAll("[data-status]").forEach((b) => b.addEventListener("click", async () => {
      const status = b.dataset.status;
      await db.rpc("set_crew_status", { p_code: code, p_device_id: deviceId(), p_status: status });
      if (status === "on_way") window.open(`https://www.google.com/maps/dir/?api=1&destination=${dest}`, "_blank", "noopener");
      render();
    }));
  }

  render().catch(() => gone("offline"));
  // Friends join and head out while the page is open: keep the crew current.
  if (new URLSearchParams(location.search).get("crew")) setInterval(() => { if (!document.querySelector("#nm:focus")) render().catch(() => {}); }, 20000);
</script>
</body>
</html>
