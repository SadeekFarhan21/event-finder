<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Scout</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0C0C0A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Night palette, same as every Scout page. */
  :root {
    --bg: #0C0C0A; --surface: #151513; --line: #282723;
    --ink: #F2F0E9; --ink-2: #C2BEB2; --ink-3: #8E8A7F;
    --yellow: #FFE14A; --on-yellow: #14130F; --yellow-hover: #F5D63E;
    --display: "Instrument Serif", Georgia, serif; --body: "Inter", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--body); }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 8px; }
  .mark { display: inline-flex; align-items: baseline; min-height: 44px; padding: 8px 0; font: 400 28px/1 var(--display); color: var(--ink); text-decoration: none; }
  .mark i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); margin-left: 3px; }
  h1 { font: 400 40px/1.1 var(--display); margin: 48px 0 0; text-wrap: balance; }
  h1 em { font-style: italic; }
  p { color: var(--ink-2); margin: 12px 0 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: 999px; font: 600 16px var(--body); text-decoration: none; }
  .btn.primary { background: var(--yellow); color: var(--on-yellow); }
  .btn.primary:hover { background: var(--yellow-hover); }
  .btn.quiet { color: var(--ink); border: 1px solid var(--line); }
  .note { font-size: 14px; color: var(--ink-3); margin-top: 32px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="mark" href="/" aria-label="Scout home">Scout<i aria-hidden="true"></i></a>
  <h1>Nothing is on <em>here.</em></h1>
  <p>This page doesn't exist, or the link was cut off. If a friend sent it, ask them to send it again.</p>
  <div class="actions">
    <a class="btn primary" href="/">Get Scout</a>
    <a class="btn quiet" href="/venues.html">Scout for Venues</a>
  </div>
  <p class="note">Scout finds what's on tonight in New York and Los Angeles and shows the ride there. An independent prototype, not an official Yelo app.</p>
</div>
</body>
</html>
